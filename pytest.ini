[pytest]
testpaths = tests
# Se silencian sólo avisos de deprecación emitidos por librerías externas
# (napari y sus dependencias, el plugin de anyio y los bindings SWIG de ITK).
# Los avisos que genere el código del proyecto siguen apareciendo.
filterwarnings =
    ignore:.*CallSpec2.*
    ignore::DeprecationWarning:app_model.*
    ignore::DeprecationWarning:npe2.*
    ignore::DeprecationWarning:napari.*
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
